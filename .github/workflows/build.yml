name: Build Skybolt
on:
  workflow_call:
    inputs:
      os:
        default: ubuntu-24.04
        type: string
      python-version:
        default: "3.11.x"
        type: string
      python-arch:
        default: "x64"
        type: string
      build_docs:
        description: Build the documentation?
        type: boolean
        default: false
      upload:
        description: Upload resulting artifact?
        type: boolean
        default: false

run-name: Build for ${{ inputs.os }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      packageDir: ${{github.workspace}}/package
      CONAN_HOME: ${{ github.workspace}}/.conan2
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
    - uses: actions/checkout@v2.4.0
      with:
        lfs: true
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.python-arch }}
    - name: Install uv
      run: |
        python3 -m pip install --upgrade pip
        pip3 install uv
    - name: Set up Conan
      uses: conan-io/setup-conan@v1
      with:
        version: "2.32.0"
        cache_packages: true # Enables automatic caching of ~/.conan2

    - name: Configure Conan profiles
      run: |
        # conan-io/setup-conan puts the default profile in the standard location
        conan profile detect --force
        echo "compiler.cppstd=20" >> ${{ env.CONAN_HOME }}/profiles/default
        if [ "${{ runner.os }}" == "Linux" ]; then
          echo "qt/*:compiler.cppstd=gnu20" >> ${{ env.CONAN_HOME }}/profiles/default
        fi
        echo "[options]" >> ${{ env.CONAN_HOME }}/profiles/default
        echo "qt/*:openssl=False" >> ${{ env.CONAN_HOME }}/profiles/default
        echo "qt/*:with_pq=False" >> ${{ env.CONAN_HOME }}/profiles/default
      shell: bash
    - name: Build
      run: |
        uv --project ${{github.workspace}}/Tools/BuildScripts run python3 ${{github.workspace}}/Tools/BuildScripts/build.py --source-dir=${{github.workspace}} --build-dir=${{github.workspace}} --package-dir=${{env.packageDir}} --stage package
    - name: Build docs
      if: inputs.build_docs
      run: |
        uv --project ${{github.workspace}}/Tools/BuildScripts run python3 ${{github.workspace}}/Tools/BuildScripts/build.py --source-dir=${{github.workspace}} --build-dir=${{github.workspace}} --package-dir=${{env.packageDir}} --stage package_docs --only
    - name: Cmake test
      run: |
        cd ${{github.workspace}}/build/Release
        ctest
    - name: Zip Build Artifact
      if: inputs.upload
      working-directory: ${{env.packageDir}}
      run: |
        7z a "${{ github.workspace }}/out/Skybolt.zip" .
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: inputs.upload
      with:
        name: Skybolt-${{ inputs.os }}
        path: ${{ github.workspace }}/out/Skybolt.zip # The file to upload
        retention-days: 1